name: returnflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: returnflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-returnflow}
      POSTGRES_USER: ${POSTGRES_USER:-returnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-returnflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - returnflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-returnflow} -d $${POSTGRES_DB:-returnflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: returnflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-returnflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-returnflow123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - returnflow_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  returnflow_postgres_data:
  returnflow_minio_data:
