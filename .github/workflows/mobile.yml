name: Mobile

# See .github/workflows/backend.yml for the full rationale behind this shape.
# In short: Pull Requests deliberately have no workflow-level `paths:` filter,
# so this workflow always starts and `Mobile CI` always reports a result — which
# is what makes it safe to mark as a required check. The job itself decides
# whether the expensive validation is needed by comparing the Pull Request's
# real base and head SHAs.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the Pull Request's base and head SHAs are both
          # present locally for the comparison below.
          fetch-depth: 0

      - name: Detect mobile changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push (already path-filtered above) or a manual run always
          # validates for real — only a Pull Request is filtered here.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The explicit base..head comparison is deliberate: diffing the
          # synthetic merge commit instead would also report changes coming
          # from `main`, which this branch did not make.
          #
          # The diff is written to a file rather than piped straight into grep.
          # These steps run under `pipefail`, and `grep -q` stops at its first
          # match — which can leave `git` killed by SIGPIPE and turn a genuine
          # match into a failed pipeline, silently skipping validation that was
          # actually required. Reading a file removes that race entirely.
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(apps/mobile/|\.github/workflows/mobile\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No mobile changes
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No mobile changes — Mobile CI validation not required."

      # Node version comes from apps/mobile/.nvmrc (currently 20.19.4), so the
      # local toolchain and CI read the same single source.
      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.relevant == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.relevant == 'true'
        # --runInBand: this suite pays a one-time React Native native-mock/module
        # initialization cost on each test file's first render() (see
        # PROGRESS.md's Phase 4.1 note on the same pattern in
        # ReturnListScreen.test.tsx). Under Jest's default parallel workers,
        # GitHub's standard (2-core) runners let enough of those first renders
        # land at the same moment to occasionally exceed Jest's 5000ms default
        # test timeout — not reproducible locally on more capable hardware, and
        # not a production or test-logic defect. Running in-band serializes
        # those first-render costs so they never compete for CPU, removing
        # worker contention as a variable entirely.
        run: npm test -- --ci --runInBand
