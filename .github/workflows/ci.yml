name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # `package` already runs the full `test` phase first in Maven's default
      # lifecycle, so this both proves the test suite and produces the
      # package in a single invocation — a separate `mvnw test` step would
      # just re-run the same tests a second time.
      - name: Test and package
        run: ./mvnw --batch-mode --no-transfer-progress package

  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # --runInBand: this suite pays a one-time React Native native-mock/module
        # initialization cost on each test file's first render() (see
        # PROGRESS.md's Phase 4.1 note on the same pattern in
        # ReturnListScreen.test.tsx). Under Jest's default parallel workers,
        # GitHub's standard (2-core) runners let enough of those first renders
        # land at the same moment to occasionally exceed Jest's 5000ms default
        # test timeout — not reproducible locally on more capable hardware, and
        # not a production or test-logic defect. Running in-band serializes
        # those first-render costs so they never compete for CPU, removing
        # worker contention as a variable entirely.
        run: npm test -- --ci --runInBand
