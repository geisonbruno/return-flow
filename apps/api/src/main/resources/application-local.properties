# Local development only. Values match infra/.env.example defaults so the
# app works out of the box against `docker compose -f infra/docker-compose.yml up -d`.
# Override any of them with real env vars if your local infra/.env differs.
# Host port defaults to 5433 (not Postgres's standard 5432) because some
# developer machines already run a native PostgreSQL install/service bound to
# 5432; the container's internal port is still the standard 5432.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:returnflow}
spring.datasource.username=${POSTGRES_USER:returnflow}
spring.datasource.password=${POSTGRES_PASSWORD:returnflow}

spring.jpa.show-sql=true

management.endpoint.health.show-details=always

logging.level.com.returnflow=DEBUG

# --- Local-only browser CORS for Expo Web UX testing (npx expo start --web,
# served at http://localhost:8081; the API itself runs at :8080, a different
# origin). See auth.security.SecurityConfig — this property only has any
# effect while this "local" profile is active; no other profile allows any
# browser origin. Native iOS/Android requests never go through a browser and
# are unaffected either way. ---
app.cors.local-origin=http://localhost:8081

# --- Return-photo storage root: explicit here (even though it matches the
# base default) so it's easy to find and override for local development.
# Repository-external on purpose — never a path inside this checkout, so a
# `git status` here never sees uploaded development photos. Override with the
# RETURN_MEDIA_STORAGE_ROOT environment variable if you want photos somewhere
# else on your machine. ---
app.storage.return-media.root=${RETURN_MEDIA_STORAGE_ROOT:${user.home}/.returnflow/media}
