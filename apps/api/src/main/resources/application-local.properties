# Local development only. Values match infra/.env.example defaults so the
# app works out of the box against `docker compose -f infra/docker-compose.yml up -d`.
# Override any of them with real env vars if your local infra/.env differs.
# Host port defaults to 5433 (not Postgres's standard 5432) because some
# developer machines already run a native PostgreSQL install/service bound to
# 5432; the container's internal port is still the standard 5432.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:returnflow}
spring.datasource.username=${POSTGRES_USER:returnflow}
spring.datasource.password=${POSTGRES_PASSWORD:returnflow}

spring.jpa.show-sql=true

management.endpoint.health.show-details=always

logging.level.com.returnflow=DEBUG
