# Production. Every value must come from the deployment environment — no
# defaults, no credentials committed to source control. Startup fails fast
# if any of these are missing, which is intentional.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.show-sql=false

# Overrides the non-secret default in application.properties: production
# startup must never rely on a committed signing secret.
app.security.access-token.secret=${ACCESS_TOKEN_SECRET}

# Browser CORS: the deployed Web app always runs on a different origin than
# this API, so its exact origin must be supplied here (comma-separated for
# more than one). Overrides the empty default in application.properties, and
# like every other value in this profile it has no default of its own: a
# deployment that forgot it would leave the Web app unable to make a single
# browser call, so failing at startup beats discovering it when an ADMIN
# cannot log in. No domain is committed here.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Do not leak internal health/db details to unauthenticated callers.
management.endpoint.health.show-details=never

logging.level.com.returnflow=INFO

# Return-photo storage: the base default (a path under this container's own
# filesystem) is NOT durable in production — it must point at a persistent
# volume, or every uploaded photo is lost on the next deploy/restart. No
# object-storage adapter exists yet (Phase 5A ships filesystem-only); see
# storage.ReturnMediaStorage's Javadoc for the intended future R2 adapter.
app.storage.return-media.root=${RETURN_MEDIA_STORAGE_ROOT}
