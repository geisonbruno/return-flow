spring.application.name=returnflow-api

# --- Actuator: local-development-useful surface only. ---
management.endpoints.web.exposure.include=health,info

# --- Jackson: all API timestamps serialize/deserialize as UTC. ---
spring.jackson.time-zone=UTC

# --- JPA / Hibernate ---
# Flyway is the only schema-migration mechanism. Hibernate must only validate
# the schema Flyway already created, never generate or alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# No physical-naming-strategy override: Hibernate's own default
# (CamelCaseToUnderscoresNamingStrategy) already converts Java camelCase to
# snake_case columns, matching this project's DB naming convention
# (tenant_id, created_at, ...). Spring Boot 4 removed its own
# SpringPhysicalNamingStrategy wrapper, so pointing at it would fail to load.

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# No datasource is configured here on purpose: connecting to a real database
# always requires an explicit environment profile (local or prod), so the
# application never silently talks to an undefined database. See
# application-local.properties and application-prod.properties.

# --- Auth: access/refresh token lifetimes (not secret, safe in every profile) ---
app.security.access-token.ttl=PT15M
app.security.refresh-token.ttl=P30D
# Access-token HMAC signing secret: this default is a non-secret, test/dev-only
# placeholder so plain @SpringBootTest classes (which activate no profile) can
# boot without every test needing @ActiveProfiles. application-prod.properties
# unconditionally overrides this with a required environment variable (no
# default), the same override pattern already used for spring.jpa.show-sql
# between profiles, so a real production deployment can never silently run on
# this value.
app.security.access-token.secret=${ACCESS_TOKEN_SECRET:local-development-and-test-only-signing-secret-never-use-in-production-min-32-bytes}

# --- Controlled first Warehouse admin bootstrap: unset (blank) by default in
# every profile, which safely disables it. Set all three together to enable. ---
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}

# --- Return-photo upload limits: rejects an oversized part before it even
# reaches ReturnPhotoService, which independently re-checks 5 MB anyway as a
# defense-in-depth backstop (see its Javadoc). max-request-size allows a
# little headroom over max-file-size for multipart boundaries/other fields. ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Return-photo binary storage (storage.FilesystemReturnMediaStorage) ---
# Filesystem-backed MVP adapter behind the storage.ReturnMediaStorage
# interface; a repository-external default so plain @SpringBootTest classes
# (no active profile) can boot without every test needing @ActiveProfiles,
# mirroring app.security.access-token.secret's default-then-profile-override
# pattern above. Production MUST mount a persistent volume at this path —
# a container filesystem is ephemeral — and is expected to eventually move to
# a Cloudflare R2/S3-compatible adapter behind the same interface (root
# CLAUDE.md §29); no calling code should need to change when that happens.
app.storage.return-media.root=${RETURN_MEDIA_STORAGE_ROOT:${user.home}/.returnflow/media}

