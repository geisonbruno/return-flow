spring.application.name=returnflow-api

# --- Actuator: local-development-useful surface only. ---
management.endpoints.web.exposure.include=health,info

# --- Jackson: all API timestamps serialize/deserialize as UTC. ---
spring.jackson.time-zone=UTC

# --- JPA / Hibernate ---
# Flyway is the only schema-migration mechanism. Hibernate must only validate
# the schema Flyway already created, never generate or alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# No physical-naming-strategy override: Hibernate's own default
# (CamelCaseToUnderscoresNamingStrategy) already converts Java camelCase to
# snake_case columns, matching this project's DB naming convention
# (tenant_id, created_at, ...). Spring Boot 4 removed its own
# SpringPhysicalNamingStrategy wrapper, so pointing at it would fail to load.

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# No datasource is configured here on purpose: connecting to a real database
# always requires an explicit environment profile (local or prod), so the
# application never silently talks to an undefined database. See
# application-local.properties and application-prod.properties.

